name: Validation Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install
      - name: Code quality budgets
        run: bun run code:quality

      - name: Build Astro site
        run: bun run build

      - name: Prettier check
        run: bunx prettier --check .

      - name: CSS hard gates (ornaments + bg-stack)
        run: bun run css:hard-gates:check
